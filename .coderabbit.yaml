# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"
early_access: false

reviews:
  # 중요한 결함은 놓치지 않되 스타일 취향 댓글이 과도해지지 않게 균형형을 사용한다.
  profile: "chill"
  high_level_summary: true
  review_status: true
  review_details: false
  collapse_walkthrough: true
  poem: false

  # 리뷰는 조언 역할만 맡고 자동 승인은 사용하지 않는다.
  auto_approvals:
    enabled: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # 작은 커밋을 자주 올릴 때 리뷰 사용량이 불필요하게 늘어나는 것을 막는다.
    auto_pause_after_reviewed_commits: 2
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"

  path_filters:
    - "!htmlcov/**"
    - "!staticfiles/**"
    - "!search/migrations/**"
    - "!practice/migrations/**"
    - "!**/*.lock"

  path_instructions:
    - path: "{search,practice}/tests/**"
      instructions: |
        pytest와 pytest-django 테스트를 검토한다.
        - 테스트가 구현을 그대로 따라 쓰거나 단순히 줄만 실행하지 않고, 사용자에게 중요한 동작을 구체적으로 assert하는지 확인한다.
        - 성공 경로뿐 아니라 잘못된 입력, 경계값, 없는 객체, 외부 서비스 실패 경로가 필요한지 확인한다.
        - mock이 검증하려는 코드까지 대체해 테스트가 항상 통과하는 구조인지 지적한다.
        - DB 저장 테스트는 응답만 보지 말고 실제 모델 상태와 관계 변경도 검증하는지 확인한다.
        - HTTP 테스트는 상태 코드, 응답 내용, DB 부작용을 목적에 맞게 함께 검증하는지 확인한다.
        - 일반 pytest에서는 Groq, Mistral, Tavily 실제 호출을 금지한다. 실제 외부 API 호출은 healthcheck 마커 테스트로만 허용한다.
        - 커버리지 숫자만 높이는 테스트보다 비즈니스 규칙과 회귀 위험을 보호하는 테스트를 우선한다.

    - path: "{search,practice}/**/*.py"
      instructions: |
        Django 서비스의 데이터 흐름과 비즈니스 규칙을 중심으로 검토한다.
        - 사용자 입력 검증, 객체 없음 처리, JSON 파싱, 점수 계산, 간격 반복 상태 변경의 경계 사례를 확인한다.
        - ORM 쿼리의 N+1, 불필요한 반복 조회, 트랜잭션 경계 문제를 확인한다.
        - 넓은 예외 처리로 오류가 조용히 사라지거나 잘못된 데이터를 저장하는지 확인한다.
        - LLM 출력은 신뢰하지 말고 구조·범위·내부 일관성을 코드에서 검증하는지 확인한다.
        - 외부 API 장애가 학습 로그 저장이나 기존 데이터의 정합성을 깨뜨리는지 확인한다.
        - 관련 테스트가 없거나 기존 테스트의 의미를 약화시키는 변경이면 구체적인 테스트 시나리오를 제안한다.

    - path: ".github/workflows/**"
      instructions: |
        - GitHub Actions 시크릿이 로그에 노출되지 않는지 확인한다.
        - 일반 CI와 실제 외부 API healthcheck가 분리되어 있는지 확인한다.
        - 테스트, Ruff, 커버리지 결과가 실패를 숨기지 않고 올바르게 전파되는지 확인한다.

chat:
  auto_reply: true
