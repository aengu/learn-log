name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:  # 수동 실행

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg18  # compose와 동일 - pgvector 확장 필요
        env:
          POSTGRES_DB: learnlog
          POSTGRES_USER: learnlog_user
          POSTGRES_PASSWORD: learnlog_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check --output-format=github .

      - name: Add Ruff to job summary
        if: always()
        run: |
          echo "## Ruff static analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if ruff check --statistics . > ruff-summary.txt 2>&1; then
            echo "✅ All checks passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Ruff found issues." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat ruff-summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run tests with coverage
        env:
          DEBUG: 'True'
          DATABASE_HOST: localhost
          # 클라이언트 생성만 통과시키는 더미값 - 실제 호출은 테스트에서 모킹한다
          GROQ_API_KEY: dummy-for-ci
          MISTRAL_API_KEY: dummy-for-ci
          TAVILY_API_KEY: dummy-for-ci
        run: >-
          pytest
          --junitxml=pytest.xml
          --cov=search
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Add coverage to job summary
        if: always()
        run: |
          echo "## LearnLog coverage report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Branch coverage is included." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment coverage on pull request
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: MishaKav/pytest-coverage-comment@v1.12.5
        with:
          title: LearnLog coverage report
          pytest-xml-coverage-path: ./coverage.xml
          junitxml-path: ./pytest.xml
          show-failed-tests: true
