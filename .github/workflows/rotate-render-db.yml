name: Rotate Render DB

on:
  schedule:
    # 매주 일요일 16:00 UTC (KST 월요일 01:00)
    - cron: '0 16 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: render-db-rotation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      rotation_required: ${{ steps.prepare.outputs.rotation_required }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download latest rotation backup for recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROTATION_DIR: rotation_backup
        run: python -m ops.render_db_rotation.download_latest_rotation_backup

      - name: Check expiry and prepare backup
        id: prepare
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WORKSPACE_ID: ${{ vars.RENDER_WORKSPACE_ID }}
          ROTATION_THRESHOLD_DAYS: '14'
          ROTATION_DIR: rotation_backup
        run: python -m ops.render_db_rotation.scheduled_rotation prepare

      - name: Preserve backup before deleting the database
        if: steps.prepare.outputs.rotation_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: render-rotation-backup-${{ github.run_id }}-${{ github.run_attempt }}-prepared
          path: rotation_backup/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Resume the original service when preparation fails
        if: failure()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WORKSPACE_ID: ${{ vars.RENDER_WORKSPACE_ID }}
          ROTATION_DIR: rotation_backup
        run: python -m ops.render_db_rotation.scheduled_rotation abort

  rotate:
    needs: prepare
    if: needs.prepare.outputs.rotation_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the prepared backup
        uses: actions/download-artifact@v4
        with:
          name: render-rotation-backup-${{ github.run_id }}-${{ github.run_attempt }}-prepared
          path: rotation_backup

      - name: Replace the database and deploy the service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WORKSPACE_ID: ${{ vars.RENDER_WORKSPACE_ID }}
          ROTATION_DIR: rotation_backup
        run: python -m ops.render_db_rotation.scheduled_rotation execute

      - name: Preserve final recovery state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-rotation-backup-${{ github.run_id }}-${{ github.run_attempt }}-final
          path: rotation_backup/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Resume only when the original database still exists
        if: failure()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WORKSPACE_ID: ${{ vars.RENDER_WORKSPACE_ID }}
          ROTATION_DIR: rotation_backup
        run: python -m ops.render_db_rotation.scheduled_rotation abort
